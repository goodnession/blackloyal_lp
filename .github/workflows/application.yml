name: Application CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/application.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOMAIN: ${{ secrets.DOMAIN || 'blackloyal.ru' }}

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: |
          cd frontend
          yarn install --immutable

      - name: Run linting
        run: |
          cd frontend
          yarn lint

      - name: Run type checking
        run: |
          cd frontend
          yarn typecheck

      - name: Run tests
        run: |
          cd frontend
          yarn test --coverage
        continue-on-error: true

      - name: Build application
        run: |
          cd frontend
          yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: frontend/.output
          retention-days: 1

  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build-image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    permissions:
      contents: read
      packages: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            
            echo "Starting application deployment..."
            
            # Create directory structure
            mkdir -p /opt/blackloyal/frontend
            cd /opt/blackloyal/frontend
            
            # Create .env.production from GitHub Secrets
            echo "Creating environment file..."
            cat > .env.production << 'ENVEOF'
            NUXT_PUBLIC_SITE_URL=${{ secrets.NUXT_PUBLIC_SITE_URL }}
            DOMAIN=${{ secrets.DOMAIN }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
            NUXT_PUBLIC_ANALYTICS_ID=${{ secrets.NUXT_PUBLIC_ANALYTICS_ID }}
            ACME_EMAIL=${{ secrets.ACME_EMAIL }}
            TRAEFIK_AUTH=${{ secrets.TRAEFIK_AUTH }}
            NUXT_PUBLIC_TELEGRAM_BOT_USERNAME=${{ secrets.NUXT_PUBLIC_TELEGRAM_BOT_USERNAME }}
            NODE_ENV=production
            PORT=3000
            HOSTNAME=0.0.0.0
            ENVEOF
            
            # Login to GitHub Container Registry (for private images)
            echo "Logging in to GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            # Pull latest Docker image
            echo "Pulling Docker image..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            # Create docker-compose.yml
            echo "Creating docker-compose configuration..."
            cat > docker-compose.yml << EOF
            version: '3.8'
            
            services:
              reverse-proxy:
                image: traefik:v3.0
                container_name: traefik
                restart: unless-stopped
                command:
                  - "--api.dashboard=true"
                  - "--providers.docker=true"
                  - "--providers.docker.exposedbydefault=false"
                  - "--entrypoints.web.address=:80"
                  - "--entrypoints.websecure.address=:443"
                  - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
                  - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
                  - "--certificatesresolvers.letsencrypt.acme.email=\${ACME_EMAIL}"
                  - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
                  - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
                  - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - /var/run/docker.sock:/var/run/docker.sock:ro
                  - traefik-certs:/letsencrypt
                networks:
                  - web
                labels:
                  - "traefik.enable=true"
                  - "traefik.http.routers.dashboard.rule=Host(\`traefik.\${DOMAIN}\`)"
                  - "traefik.http.routers.dashboard.service=api@internal"
                  - "traefik.http.routers.dashboard.entrypoints=websecure"
                  - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
                  - "traefik.http.routers.dashboard.middlewares=auth"
                  - "traefik.http.middlewares.auth.basicauth.users=\${TRAEFIK_AUTH}"
                environment:
                  - ACME_EMAIL=\${ACME_EMAIL}
                  - DOMAIN=\${DOMAIN}
                  - TRAEFIK_AUTH=\${TRAEFIK_AUTH}
            
              app:
                image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                container_name: blackloyal-app
                restart: unless-stopped
                env_file:
                  - .env.production
                networks:
                  - web
                labels:
                  - "traefik.enable=true"
                  - "traefik.http.routers.app.rule=Host(\`\${DOMAIN}\`)"
                  - "traefik.http.routers.app.entrypoints=websecure"
                  - "traefik.http.routers.app.tls.certresolver=letsencrypt"
                  - "traefik.http.services.app.loadbalancer.server.port=3000"
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
                  interval: 30s
                  timeout: 3s
                  retries: 3
                  start_period: 40s
                environment:
                  - DOMAIN=\${DOMAIN}
            
            networks:
              web:
                driver: bridge
            
            volumes:
              traefik-certs:
            EOF
            
            # Stop existing containers (including Terraform nginx)
            echo "Stopping existing containers..."
            docker-compose down 2>/dev/null || true
            docker-compose -f /opt/blackloyal/docker-compose.prod.yml down 2>/dev/null || true
            
            # Stop any containers using ports 80/443
            docker stop $(docker ps -q --filter "publish=80") 2>/dev/null || true
            docker stop $(docker ps -q --filter "publish=443") 2>/dev/null || true
            
            # Export environment variables for docker-compose
            export ACME_EMAIL=${{ secrets.ACME_EMAIL }}
            export DOMAIN=${{ secrets.DOMAIN }}
            export TRAEFIK_AUTH=${{ secrets.TRAEFIK_AUTH }}
            
            # Start new containers
            echo "Starting application..."
            docker-compose up -d
            
            # Clean up old images
            echo "Cleaning up old Docker images..."
            docker image prune -f
            
            echo "Application deployment completed successfully!"

      - name: Health Check
        run: |
          echo "Waiting for application to start..."
          sleep 30
          
          # Health check with retries
          for i in {1..5}; do
            if curl -f "https://${{ secrets.DOMAIN }}/api/health"; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Health check attempt $i failed, retrying in 10 seconds..."
            sleep 10
          done
          
          echo "Health check failed after 5 attempts"
          exit 1

