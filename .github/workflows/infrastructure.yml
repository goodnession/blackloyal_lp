name: Infrastructure Management

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
  push:
    paths:
      - 'terraform/**'
      - '.github/workflows/infrastructure.yml'
    branches: [ main ]

env:
  TF_VERSION: '1.6.0'
  TF_WORKING_DIR: './terraform'

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Plan
        if: github.event.inputs.action == 'plan' || github.event_name == 'push'
        run: terraform plan -var="twc_token=${{ secrets.TWC_TOKEN }}" -var="server_id=${{ secrets.SERVER_ID }}" -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" -var="ssh_private_key=${{ secrets.SSH_PRIVATE_KEY }}"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve -var="twc_token=${{ secrets.TWC_TOKEN }}" -var="server_id=${{ secrets.SERVER_ID }}" -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" -var="ssh_private_key=${{ secrets.SSH_PRIVATE_KEY }}"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve -var="twc_token=${{ secrets.TWC_TOKEN }}" -var="server_id=${{ secrets.SERVER_ID }}" -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" -var="ssh_private_key=${{ secrets.SSH_PRIVATE_KEY }}"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Output Infrastructure Info
        if: github.event.inputs.action == 'apply'
        run: |
          echo "## Infrastructure Details" >> $GITHUB_STEP_SUMMARY
          echo "Server IP: $(terraform output -raw server_ip)" >> $GITHUB_STEP_SUMMARY
          echo "Domain: $(terraform output -raw domain)" >> $GITHUB_STEP_SUMMARY
        working-directory: ${{ env.TF_WORKING_DIR }}

